name: Update uncov formula

# GitHub Actions has no native "wait N hours" primitive (jobs cap at 6h, and
# you can't schedule a one-off future run), so we do NOT trigger off the
# upstream release event. Instead a schedule polls upstream and only bumps the
# formula once the latest release has aged past MIN_AGE_HOURS. That guarantees
# a minimum hold window (default 24h) and self-heals if a run is missed.
#
# With a 6h cron + 24h gate, a bump lands within ~[release+24h, release+30h].
#
# NOTE: GitHub disables scheduled workflows after 60 days with no repo
# activity. Formula bumps keep this repo active; if it ever goes quiet longer
# than that, re-enable from the Actions tab or use the manual run below.

on:
  schedule:
    - cron: "7 */6 * * *"   # every 6 hours, offset from the other formula updaters
  workflow_dispatch:
    inputs:
      force:
        description: "Bump immediately, ignoring the hold window"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-uncov-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UPSTREAM: llbbl/uncov
      FORMULA: Formula/uncov.rb
      MIN_AGE_HOURS: "24"
      GH_TOKEN: ${{ github.token }}
      FORCE: ${{ github.event.inputs.force || 'false' }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve latest upstream release
        id: rel
        run: |
          set -euo pipefail

          # Latest stable release (isLatest excludes drafts and prereleases).
          line=$(gh release list --repo "$UPSTREAM" --limit 30 \
                   --json tagName,publishedAt,isLatest \
                   --jq 'map(select(.isLatest)) | first | "\(.tagName)\t\(.publishedAt)"')
          tag=${line%%$'\t'*}
          published=${line#*$'\t'}
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No stable upstream release found; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          current=$(grep -E '^\s*version\s+"' "$FORMULA" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Upstream latest: $tag (published $published) | formula: v$current"

          if [ "v$current" = "$tag" ]; then
            echo "Formula already at $tag; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Minimum release window: gate on the release's age.
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$published" +%s) ) / 3600 ))
          echo "Release age: ${age_h}h (min ${MIN_AGE_HOURS}h, force=${FORCE})"
          if [ "$age_h" -lt "$MIN_AGE_HOURS" ] && [ "$FORCE" != "true" ]; then
            echo "Release is within the ${MIN_AGE_HOURS}h hold window; will revisit on a later run."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"

      - name: Bump formula
        if: steps.rel.outputs.skip != 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail

          tmp=$(mktemp -d)

          # uncov ships bare binaries with no checksums.txt manifest. Upstream
          # published per-binary `.sha256` sidecars up to v0.1.4 and stopped at
          # v0.1.6, so we download the binaries and hash them ourselves. This
          # step only runs when a bump is actually due, so the ~230MB transfer
          # is not paid on every poll.
          for asset in uncov-darwin-arm64 uncov-darwin-x64 uncov-linux-x64; do
            gh release download "$TAG" --repo "$UPSTREAM" --pattern "$asset" --dir "$tmp"
            if [ ! -s "$tmp/$asset" ]; then
              echo "::error::$TAG is missing expected asset $asset"
              exit 1
            fi
          done

          sha() { sha256sum "$tmp/$1" | awk '{print $1}'; }
          da_arm=$(sha uncov-darwin-arm64)
          da_x64=$(sha uncov-darwin-x64)
          lx_x64=$(sha uncov-linux-x64)

          bash scripts/render-uncov-formula.sh "$TAG" "$da_arm" "$da_x64" "$lx_x64" > "$FORMULA"

          if git diff --quiet -- "$FORMULA"; then
            echo "Formula already matches rendered output; nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          git commit -m "Update uncov formula to $TAG"
          git push
